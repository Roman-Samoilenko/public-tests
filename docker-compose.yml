services:
  postgres-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ../auth-service/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U auth_user -d auth_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-main:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: main_db
      POSTGRES_USER: main_user
      POSTGRES_PASSWORD: main_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_main_data:/var/lib/postgresql/data
      - ./backend/migrations/000001_init.up.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./backend/migrations/000002_features.up.sql:/docker-entrypoint-initdb.d/02_features.sql:ro
      - ./backend/migrations/000003_seed_official_tests.up.sql:/docker-entrypoint-initdb.d/03_seed.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U main_user -d main_db" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 7s
      timeout: 7s
      retries: 11

  auth-service:
    build:
      context: ../auth-service
    environment:
      HTTP_PORT: "8081"
      DATABASE_URL: "postgres://auth_user:auth_pass@postgres-auth:5432/auth_db?sslmode=disable"
      JWT_SECRET: "dev-secret-change-in-production-min-32-chars"
      CONTACT_PEPPER: "dev-pepper-change-in-production"
      ACCESS_TOKEN_TTL: "1m"
      REFRESH_TOKEN_TTL: "168h"
      REDIS_ADDR: "redis:6379"
      AWS_ACCESS_KEY_ID: "dev"
      AWS_SECRET_ACCESS_KEY: "dev"
      POSTBOX_SENDER: "dev@local"
      AWS_REGION: "dev"
    ports:
      - "8081:8081"
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: "8080"
      DATABASE_URL: "postgres://main_user:main_pass@postgres-main:5432/main_db?sslmode=disable"
      JWT_SECRET: "dev-secret-change-in-production-min-32-chars"
    ports:
      - "8080:8080"
    depends_on:
      postgres-main:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_auth_data:
  postgres_main_data:

networks:
  default:
    name: stat-platform-net
    driver: bridge
