http {

    # Зона для API: 10 Мб памяти, ключ по IP, лимит 10 запросов в секунду
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Зона для Auth API: лимит 5 запросов в минуту (более строгий)
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

    # Для статики/фронтенда можно либо не ограничивать, либо задать высокий лимит
    # limit_req_zone $binary_remote_addr zone=static_limit:10m rate=100r/s;

}