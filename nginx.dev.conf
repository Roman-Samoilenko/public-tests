limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

server {
    listen 8000;
    server_name localhost;

    set $env "dev";
    add_header X-RateLimit-Environment $env always;

    # Auth API — с ограничением 5 r/m, burst=3 без задержки
    location /api/auth/ {
        limit_req zone=auth_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://auth-service:8081/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Основное API — 10 r/s, burst=20
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite HMR WebSocket — без ограничений (или с высоким burst)
    location /@vite/ {
        proxy_pass http://frontend:5173/@vite/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /node_modules/ {
        proxy_pass http://frontend:5173/node_modules/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Всё остальное — на Vite dev-сервер
    location / {
        # Для dev-режима можно не ограничивать или задать мягкий лимит
        # limit_req zone=static_limit burst=50 nodelay;
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
    }
}